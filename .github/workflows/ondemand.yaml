
on:
  workflow_dispatch:
    inputs:
      terraform_variables:
        required: false
        type: string
  repository_dispatch:
    types: [ondemand]

jobs:
  ondemand-test:
    runs-on: ubuntu-latest
    
    steps:
      # ============================================
      # INÍCIO - Capturar timestamp inicial
      # ============================================
      - name: 📊 Start Timer
        id: start-timer
        run: |
          echo "start_time=$(date +%s)" >> $GITHUB_OUTPUT
          echo "🕐 Workflow started at: $(date '+%Y-%m-%d %H:%M:%S')"
      
      # ============================================
      # SETUP STEPS
      # ============================================
      - name: ⏱️ Checkout
        id: checkout
        uses: actions/checkout@v4
      
      - name: 📊 Checkpoint - Checkout
        run: |
          echo "checkout_end=$(date +%s)" >> $GITHUB_ENV
          START_TIME=${{ steps.start-timer.outputs.start_time }}
          NOW=$(date +%s)
          ELAPSED=$((NOW - START_TIME))
          echo "✓ Checkout completed in ${ELAPSED}s"
      
      - name: ⏱️ Setup Terraform
        id: setup-tf
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      
      - name: 📊 Checkpoint - Setup Terraform
        run: |
          START_TIME=${{ steps.start-timer.outputs.start_time }}
          NOW=$(date +%s)
          ELAPSED=$((NOW - START_TIME))
          echo "✓ Terraform setup completed in ${ELAPSED}s"
      
      - name: ⏱️ Install genisoimage
        run: |
          START=$(date +%s)
          sudo apt install -y genisoimage
          END=$(date +%s)
          echo "⏱️  genisoimage install: $((END - START))s"
      
      - name: ⏱️ Configure SSH
        run: |
          START=$(date +%s)
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/proxy.key
          chmod 600 ~/.ssh/proxy.key
          echo "$QEMU_KEY" > ~/.ssh/qemu.key
          chmod 600 ~/.ssh/qemu.key
          echo "$GIT_KEY" > ~/.ssh/git.key
          chmod 600 ~/.ssh/git.key
          cat >>~/.ssh/config <<END
          Host proxy
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/proxy.key
            StrictHostKeyChecking no
            Port $SSH_PORT
          Host qemu
            HostName $QEMU_HOST
            IdentityFile ~/.ssh/qemu.key
            StrictHostKeyChecking no
            ProxyJump proxy
          END
          END=$(date +%s)
          echo "⏱️  SSH config: $((END - START))s"
        env:
          SSH_USER: ${{ secrets.PROXY_USERNAME }}
          SSH_KEY: ${{ secrets.SSH_PROXY_KEY }}
          SSH_HOST: ${{ secrets.PROXY_HOST }}
          SSH_PORT: ${{ secrets.PROXY_PORT }}
          QEMU_USER: ${{ secrets.USERNAME }}
          QEMU_HOST: ${{ secrets.HOST }}
          QEMU_KEY: ${{ secrets.KEY }}
          QEMU_PORT: ${{ secrets.HOST }}
          GIT_KEY: ${{ secrets.GIT_KEY }}
      
      # ============================================
      # TERRAFORM WORKFLOW (Core da medição)
      # ============================================
      - name: ⏱️ Terraform Init
        id: init
        run: |
          START=$(date +%s)
          terraform init
          END=$(date +%s)
          echo "init_duration=$((END - START))" >> $GITHUB_OUTPUT
          echo "⏱️  Terraform Init: $((END - START))s"
        env:
          GIT_SSH_COMMAND: "echo '${{ secrets.GIT_KEY }}' > id_rsa
          && ssh-keyscan github.com > known_hosts
          && chmod 600 id_rsa known_hosts
          && ssh -i ./id_rsa -o UserKnownHostsFile=./known_hosts"
        
      - name: ⏱️ Terraform Plan
        id: plan
        run: |
          START=$(date +%s)
          terraform plan -var=`${{ inputs.terraform_variables }}` -no-color -input=false -out=tfplan
          END=$(date +%s)
          echo "plan_duration=$((END - START))" >> $GITHUB_OUTPUT
          echo "⏱️  Terraform Plan: $((END - START))s"
      
      - name: ⏱️ Terraform Apply
        id: apply
        if: steps.plan.outcome == 'success'
        run: |
          START=$(date +%s)
          terraform apply -auto-approve tfplan
          END=$(date +%s)
          echo "apply_duration=$((END - START))" >> $GITHUB_OUTPUT
          echo "⏱️  Terraform Apply: $((END - START))s"
      
      - name: Terraform Destroy on Apply Failure
        if: failure() && steps.apply.outcome == 'failure'
        run: terraform destroy -auto-approve
      
      - name: Copy state
        run: scp terraform.tfstate $QEMU_USER@qemu:/home/$QEMU_USER
        env:
          QEMU_USER: ${{ secrets.USERNAME }}
          QEMU_HOST: ${{ secrets.HOST }}
      
      - name: Get IP addresses from Terraform
        id: tf-output
        run: |
          terraform output -json k8s > k8s.json
          echo "🔍 Terraform Output:"
          cat k8s.json
          IPS=$(jq -r 'to_entries | map(.value.domain[]?.address) | join(" ")' k8s.json)
          echo "ip_list=${IPS}" >> $GITHUB_OUTPUT
      
      # ============================================
      # RESUMO FINAL
      # ============================================
      - name: 📊 Performance Summary
        if: always()
        run: |
          START_TIME=${{ steps.start-timer.outputs.start_time }}
          END_TIME=$(date +%s)
          TOTAL_DURATION=$((END_TIME - START_TIME))
          
          echo "========================================"
          echo "   PIPELINE PERFORMANCE REPORT"
          echo "========================================"
          echo ""
          echo "Terraform Init:  ${{ steps.init.outputs.init_duration }}s"
          echo "Terraform Plan:  ${{ steps.plan.outputs.plan_duration }}s"
          echo "Terraform Apply: ${{ steps.apply.outputs.apply_duration }}s"
          echo ""
          echo "TOTAL PIPELINE:  ${TOTAL_DURATION}s (~$((TOTAL_DURATION / 60))m)"
          echo "========================================"
          
          # Salvar em artifact
          cat > performance_report.txt <<EOF
          Pipeline Performance Report
          Execution Date: $(date '+%Y-%m-%d %H:%M:%S')
          
          Timings:
          - Terraform Init:  ${{ steps.init.outputs.init_duration }}s
          - Terraform Plan:  ${{ steps.plan.outputs.plan_duration }}s
          - Terraform Apply: ${{ steps.apply.outputs.apply_duration }}s
          
          Total: ${TOTAL_DURATION}s
          EOF
      
      - name: Upload Performance Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: performance_report.txt

